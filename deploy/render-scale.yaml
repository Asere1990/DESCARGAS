{
  "databases": [
    {
      "name": "DESCARGAS-DB",
      "plan": "0.5c-1g",
      "region": "virginia",
      "diskSizeGB": 5,
      "ipAllowList": [],
      "postgresMajorVersion": "16",
      "storageAutoscalingEnabled": false
    }
  ],
  "services": [
    {
      "type": "web",
      "name": "DESCARGAS",
      "runtime": "python",
      "repo": "https://github.com/Asere1990/DESCARGAS",
      "branch": "main",
      "plan": "0.5c-512mb",
      "region": "virginia",
      "numInstances": 1,
      "buildCommand": "pip install -r requirements.txt",
      "startCommand": "python scale_web.py",
      "healthCheckPath": "/readyz",
      "envVars": [
        {
          "key": "DATABASE_URL",
          "fromDatabase": {
            "name": "DESCARGAS-DB",
            "property": "connectionString"
          }
        },
        {
          "key": "QUEUE_CAPACITY",
          "value": "10000"
        },
        {
          "key": "LOGIN_CAPACITY",
          "value": "50"
        }
      ]
    },
    {
      "type": "worker",
      "name": "DESCARGAS-WORKER",
      "runtime": "python",
      "repo": "https://github.com/Asere1990/DESCARGAS",
      "branch": "main",
      "plan": "1c-2g",
      "region": "virginia",
      "numInstances": 2,
      "buildCommand": "pip install -r requirements.txt",
      "startCommand": "python scale_worker.py",
      "envVars": [
        {
          "key": "DATABASE_URL",
          "fromDatabase": {
            "name": "DESCARGAS-DB",
            "property": "connectionString"
          }
        },
        {
          "key": "DESCARGAS_SESSION_KEY",
          "fromService": {
            "type": "web",
            "name": "DESCARGAS",
            "envVarKey": "DESCARGAS_SESSION_KEY"
          }
        },
        {
          "key": "DOWNLOAD_CONCURRENCY",
          "value": "3"
        },
        {
          "key": "DB_POOL_SIZE",
          "value": "12"
        }
      ]
    }
  ],
  "previews": {
    "generation": "off"
  }
}
