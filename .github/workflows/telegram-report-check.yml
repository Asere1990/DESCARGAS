name: Reporte manual Telegram — panel
on:
  push:
    branches: [feature/telegram-manual-report-20261113]
  pull_request:
    paths:
      - 'descargas_app/panel_reports.py'
      - 'descargas_app/web_panel.py'
      - 'descargas_app/panel_web/app.js'
      - 'tests/test_panel_reporting.py'
      - '.github/workflows/telegram-report-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_panel_reporting -v
      - run: node --check descargas_app/panel_web/app.js
