name: Índice de grupos y canales — pruebas
on:
  push:
    branches: [feature/panel-entity-membership-index-20261113]
  pull_request:
    paths:
      - 'descargas_app/panel_entity_index.py'
      - 'descargas_app/panel_background_search.py'
      - 'descargas_app/panel_web/app.js'
      - 'tests/test_panel_entity_index.py'
      - 'tests/test_panel_background_search.py'
      - '.github/workflows/panel-entity-index.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: descargas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d descargas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:local_test_only@localhost:5432/descargas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q descargas_app/panel_entity_index.py descargas_app/panel_background_search.py
      - run: python -m unittest tests.test_panel_entity_index tests.test_panel_background_search -v
      - run: node --check descargas_app/panel_web/app.js
      - run: node --test tests/test_panel_background_client.cjs tests/test_panel_entity_search.cjs tests/test_panel_complete_search.cjs
