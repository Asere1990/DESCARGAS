name: Web Galerías — carpeta multiorigen segura
on:
  push:
    branches: [feature/web-galerias-multi-origin-folder-20261113]
  pull_request:
    paths:
      - 'web_galerias/folder_sources.py'
      - 'web_galerias/core.py'
      - 'web_galerias/admin.py'
      - 'web_galerias/app.js'
      - 'web_galerias/personal.py'
      - 'web_galerias/user_features.py'
      - 'web_galerias/downloads.py'
      - 'web_galerias/location.py'
      - 'web_galerias/moderation.py'
      - 'tests/test_web_galerias_multi_source_pg.py'
      - '.github/workflows/web-galerias-multi-source.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: descargas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d descargas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:local_test_only@localhost:5432/descargas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Sintaxis y código JS
        run: |
          python -m compileall -q web_galerias galerias_standalone.py
          node --check web_galerias/app.js
      - name: Integración PostgreSQL real, captions, replies, OCR, descargas, permisos
        run: python -m unittest tests.test_web_galerias_multi_source_pg -v
      - name: Regresiones principales de Web Galerías
        run: |
          python -m unittest tests.test_web_galerias_datos_source tests.test_web_galerias_sync tests.test_web_galerias_album_metadata tests.test_web_galerias_exact_account tests.test_web_galerias_priority tests.test_web_galerias_media_integrity tests.test_web_galerias_personal_features tests.test_web_galerias_admin_tools tests.test_web_galerias_admin_user_controls -v
      - name: Interfaz de Web Galerías y navegación
        run: |
          node --test tests/test_web_galerias_album_metadata.cjs tests/test_web_galerias_priority.cjs tests/test_web_galerias_exact_account.cjs tests/test_web_galerias_favorite_gestures.cjs tests/test_web_galerias_admin_mirror.cjs
