name: Web Galerías — piloto privado
on:
  push:
    branches: [feature/web-galerias-piloto-20261110]
  pull_request:
    paths:
      - 'web_galerias/**'
      - 'tests/test_web_galerias.py'
      - 'tests/test_web_galerias_drag.cjs'
      - 'tests/test_web_galerias_personal_menus.py'
      - 'tests/test_web_galerias_intro_video.py'
      - 'tests/test_web_galerias_standalone.py'
      - 'tests/test_web_galerias_sync.py'
      - 'tests/test_web_galerias_mobile_navigation.py'
      - 'tests/test_web_galerias_public_metadata.py'
      - 'tests/test_web_galerias_payment_gate.py'
      - 'tests/test_web_galerias_payment_link.py'
      - 'tests/test_web_galerias_paid_recovery.py'
      - 'tests/test_web_galerias_browser_admin.py'
      - 'galerias_standalone.py'
      - 'descargas_app/subscription_actions.py'
      - 'tests/test_subscription_actions.py'
      - 'descargas_app/scalable.py'
      - 'tests/test_galerias_start_button.py'
      - 'descargas_app/service.py'
      - 'scale_web.py'
      - 'pyproject.toml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisión de sintaxis
        run: |
          python -m compileall -q web_galerias descargas_app galerias_standalone.py
          node --check web_galerias/app.js
          node --test tests/test_web_galerias_drag.cjs
      - name: Dependencias
        run: pip install -e .
      - name: Tests de Web Galerías
        run: |
          python -m unittest discover -s tests -p test_web_galerias.py -v
          python -m unittest discover -s tests -p test_web_galerias_personal_menus.py -v
          python -m unittest discover -s tests -p test_web_galerias_intro_video.py -v
          python -m unittest discover -s tests -p test_web_galerias_standalone.py -v
          python -m unittest discover -s tests -p test_web_galerias_sync.py -v
          python -m unittest discover -s tests -p test_subscription_actions.py -v
          python -m unittest discover -s tests -p test_galerias_start_button.py -v
          python -m unittest discover -s tests -p test_web_galerias_mobile_navigation.py -v
          python -m unittest discover -s tests -p test_web_galerias_public_metadata.py -v
          python -m unittest discover -s tests -p test_web_galerias_payment_gate.py -v
          python -m unittest discover -s tests -p test_web_galerias_payment_link.py -v
          python -m unittest discover -s tests -p test_web_galerias_paid_recovery.py -v
          python -m unittest discover -s tests -p test_web_galerias_browser_admin.py -v
