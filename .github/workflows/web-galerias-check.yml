      - 'descargas_app/scalable.py'
      - 'tests/test_galerias_start_button.py'
      - 'descargas_app/service.py'
      - 'scale_web.py'
      - 'pyproject.toml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisión de sintaxis
        run: |
          python -m compileall -q web_galerias descargas_app galerias_standalone.py
          node --check web_galerias/app.js
          node --check web_galerias/admin_tools.js
          node --check web_galerias/admin_mirror.js
          node --check web_galerias/admin_account.js
          node --check web_galerias/broadcast_ui.js
          node --test tests/test_web_galerias_album_metadata.cjs
          node --test tests/test_web_galerias_broadcasts.cjs
          node --test tests/test_web_galerias_admin_account.cjs
          node --test tests/test_web_galerias_admin_playback.cjs
          node --test tests/test_web_galerias_priority.cjs
          node --test tests/test_web_galerias_priority_scale.cjs
          node --test tests/test_web_galerias_large_video_playback.cjs
          node --test tests/test_web_galerias_failed_video_icon.cjs
          node --test tests/test_web_galerias_exact_account.cjs
          node --test tests/test_web_galerias_admin_mirror.cjs
          node --test tests/test_web_galerias_drag.cjs
          node --test tests/test_web_galerias_label_sizes.cjs
          node --test tests/test_web_galerias_no_default_flash.cjs
          node --test tests/test_web_galerias_fast_intro.cjs
          node --test tests/test_web_galerias_library_identity.cjs
          node --test tests/test_web_galerias_user_features.cjs
          node --test tests/test_web_galerias_favorite_gestures.cjs
          node --test tests/test_web_galerias_resume_offers.cjs
          node --test tests/test_web_galerias_cross_app_return.cjs
          node --test tests/test_web_galerias_quota_support.cjs
      - name: Dependencias
        run: pip install -e .
      - name: Tests de Web Galerías
        run: |
          python -m unittest discover -s tests -p test_web_galerias.py -v
          python -m unittest discover -s tests -p test_web_galerias_personal_menus.py -v
          python -m unittest discover -s tests -p test_web_galerias_intro_video.py -v
          python -m unittest discover -s tests -p test_web_galerias_fast_intro.py -v
          python -m unittest discover -s tests -p test_web_galerias_library_identity.py -v
          python -m unittest discover -s tests -p test_web_galerias_standalone.py -v
          python -m unittest discover -s tests -p test_web_galerias_public_bot_rotation.py -v
          python -m unittest discover -s tests -p test_web_galerias_sync.py -v
          python -m unittest discover -s tests -p test_web_galerias_priority.py -v
          python -m unittest discover -s tests -p test_web_galerias_priority_scale.py -v
          python -m unittest discover -s tests -p test_web_galerias_large_video_playback.py -v
          python -m unittest discover -s tests -p test_web_galerias_playback_alert.py -v
          python -m unittest discover -s tests -p test_web_galerias_video_diagnostic.py -v
          python -m unittest discover -s tests -p test_web_galerias_media_integrity.py -v
          python -m unittest discover -s tests -p test_web_galerias_album_metadata.py -v
          python -m unittest discover -s tests -p test_web_galerias_datos_source.py -v
