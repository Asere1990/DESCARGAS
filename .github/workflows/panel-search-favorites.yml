name: DESCARGAS panel search and favorites regression
on:
  pull_request:
    paths:
      - 'descargas_app/panel_background_search.py'
      - 'descargas_app/panel_favorites.py'
      - 'descargas_app/web_panel.py'
      - 'descargas_app/pg_store.py'
      - 'descargas_app/panel_web/**'
      - 'tests/test_panel_background_search.py'
      - 'tests/test_panel_favorites.py'
      - 'tests/test_panel_account_favorite_client.cjs'
      - 'tests/test_panel_background_client.cjs'
      - 'tests/test_web_panel.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: descargas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d descargas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:local_test_only@localhost:5432/descargas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q descargas_app
      - run: node --check descargas_app/panel_web/app.js
      - run: node --test tests/test_panel_background_client.cjs tests/test_panel_account_cache.cjs tests/test_panel_account_favorite_client.cjs
      - run: python -m unittest discover -s tests -p test_panel_background_search.py -v
      - run: python -m unittest discover -s tests -p test_panel_favorites.py -v
      - run: python -m unittest discover -s tests -p test_web_panel.py -v
