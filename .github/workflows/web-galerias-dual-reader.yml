name: Web Galerías — DATOS y DESCARGAS por cuenta real
on:
  pull_request:
    paths:
      - 'web_galerias/reader_sessions.py'
      - 'web_galerias/sync.py'
      - 'web_galerias/on_demand.py'
      - 'web_galerias/folder_sources.py'
      - 'tests/test_web_galerias_dual_reader.py'
      - 'tests/test_web_galerias_datos_source.py'
      - 'tests/test_web_galerias_priority.py'
      - 'tests/test_web_galerias_priority_scale.py'
      - '.github/workflows/web-galerias-dual-reader.yml'
permissions:
  contents: read
jobs:
  dual-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: descargas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d descargas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:local_test_only@localhost:5432/descargas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validar sintaxis
        run: python -m compileall -q web_galerias
      - name: Dos fuentes, lock de Telegram real y descargas bajo demanda
        run: |
          python -m unittest tests.test_web_galerias_dual_reader tests.test_web_galerias_datos_source tests.test_web_galerias_priority tests.test_web_galerias_priority_scale -v
      - name: Regresiones del sincronizador y recuperación de fuentes
        run: |
          python -m unittest tests.test_web_galerias_sync tests.test_web_galerias_source_recovery_pg -v
